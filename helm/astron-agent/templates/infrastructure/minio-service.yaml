{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "astron-agent.fullname" . }}-minio
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  type: {{ .Values.minio.service.type }}
  ports:
  - name: api
    port: {{ .Values.minio.service.apiPort }}
    targetPort: api
    protocol: TCP
    {{- if and (eq .Values.minio.service.type "NodePort") .Values.minio.service.nodePort }}
    nodePort: {{ .Values.minio.service.nodePort }}
    {{- end }}
  selector:
    {{- include "astron-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: minio
{{- if .Values.minio.consoleService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "astron-agent.fullname" . }}-minio-console
  labels:
    {{- include "astron-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-console
spec:
  type: {{ .Values.minio.consoleService.type }}
  ports:
  - name: console
    port: {{ .Values.minio.consoleService.port }}
    targetPort: console
    protocol: TCP
    {{- if and (eq .Values.minio.consoleService.type "NodePort") .Values.minio.consoleService.nodePort }}
    nodePort: {{ .Values.minio.consoleService.nodePort }}
    {{- end }}
  selector:
    {{- include "astron-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: minio
{{- end }}
{{- end }}
